<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- temperature-ramp glyph: the one data ramp, cool → warm -->
  <rect width="32" height="32" rx="7" fill="#0B0C14"/>
  <defs>
    <linearGradient id="ramp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7D6BFF"/>
      <stop offset="0.5" stop-color="#565A6E"/>
      <stop offset="1" stop-color="#FFD08A"/>
    </linearGradient>
  </defs>
  <path d="M6 21 C 10 12, 13 24, 17 16 S 24 8, 26 11" fill="none" stroke="url(#ramp)" stroke-width="3.2" stroke-linecap="round"/>
</svg>
